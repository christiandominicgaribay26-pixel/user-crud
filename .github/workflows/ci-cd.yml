name: Deploy Ionic App Locally

on:
  push:
    branches: [ master, main ]  # Pinayagan natin pareho
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Ionic image
        run: docker build --no-cache -t ionic-firebase-crud .  # Idinagdag ang --no-cache

      - name: Remove previous container
        run: docker rm -f ionic-crud
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name ionic-crud --restart unless-stopped -p 8100:8100 ionic-firebase-crud

      - name: Verify app
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri http://localhost:8100 -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "App is up and running!"
                $success = $true
                break
              }
            } catch {
              Write-Host "Attempt $i failed. Waiting 2 seconds..."
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            Write-Host "=== DOCKER LOGS ==="
            docker logs ionic-crud
            Write-Host "==================="
            exit 1
          }