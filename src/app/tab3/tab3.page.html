<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Products Overview
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Products Overview</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="ion-padding">
    <ion-card>
      <ion-card-content>
        <h2>Total Products</h2>
        <h1>{{ totalUsers }}</h1>
      </ion-card-content>
    </ion-card>

    <ion-list *ngIf="products.length; else noProducts">
      <ion-item *ngFor="let product of products">
        <ion-label>
          <h2>{{ product.productName }}</h2>
          <p>{{ product.category }} | {{ product.quantity }} in stock</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <ng-template #noProducts>
      <ion-card>
        <ion-card-content>
          No products yet. Add one in Tab 1.
        </ion-card-content>
      </ion-card>
    </ng-template>
  </div>
</ion-content>
